<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>SVI ERP — BUDGET</title>

  <link rel="stylesheet" href="styles.css">
</head>


<body>

  <div class="app">


    <!-- =====================================================
         MENU LATÉRAL
         ===================================================== -->

    <aside class="sidebar">

      <div class="brand">
        SVI <span>ERP</span>
      </div>

      <nav>

        <button
          class="nav active"
          data-view="budget"
        >
          BUDGET
        </button>

        <button
          class="nav"
          data-view="decomposition"
        >
          DÉCOMPOSITION PROJET
        </button>

        <button
          class="nav"
          data-view="achats"
        >
          ARTICLES ACHATS
        </button>

      </nav>

    </aside>


    <!-- =====================================================
         CONTENU PRINCIPAL
         ===================================================== -->

    <main class="main">


      <!-- ===================================================
           BARRE SUPÉRIEURE
           =================================================== -->

      <header class="topbar">

        <button
          id="menuBtn"
          class="menu-btn"
          type="button"
        >
          ☰
        </button>

        <h1 id="pageTitle">
          BUDGET
        </h1>

        <div class="version">
          BDG · PROTOTYPE V1
        </div>

      </header>


      <!-- ===================================================
           VUE BUDGET
           =================================================== -->

      <section
        id="budget"
        class="view active-view"
      >


        <!-- ===============================================
             SÉLECTEURS
             =============================================== -->

        <section class="selectors card">


          <div class="field">

            <label for="project">
              PROJET
            </label>

            <select id="project"></select>

          </div>


          <div class="field">

            <label for="lot">
              LOT
            </label>

            <select id="lot"></select>

          </div>


          <div class="field">

            <label for="primary">
              ACTIVITÉ PRIMAIRE
            </label>

            <select id="primary"></select>

          </div>


          <div class="field">

            <label for="secondary">
              ACTIVITÉ SECONDAIRE
            </label>

            <select id="secondary"></select>

          </div>


          <div class="field designation-field">

            <label for="brdDesignation">
              DÉSIGNATION (BRD)
            </label>

            <input
              id="brdDesignation"
              type="text"
              readonly
            >

          </div>


        </section>


        <!-- ===============================================
             DÉTAIL PRODUIT
             =============================================== -->

        <section class="card panel">

          <div class="panel-title">

            <h2>
              DÉTAIL PRODUIT
            </h2>

            <div class="panel-actions">

              <button
                class="icon"
                type="button"
                title="Ajouter"
              >
                +
              </button>

            </div>

          </div>


          <div
            class="table-wrap"
            id="productPanel"
          >

            <table id="productTable">

              <thead>

                <tr>

                  <th>N°</th>
                  <th>DÉSIGNATION</th>
                  <th>UPB</th>
                  <th>NBR</th>
                  <th>DIM 1</th>
                  <th>DIM 2</th>
                  <th>DIM 3</th>
                  <th>QPB PRT</th>
                  <th>PPB</th>
                  <th>MPB</th>

                </tr>

              </thead>

              <tbody></tbody>

            </table>

          </div>

        </section>


        <!-- ===============================================
             DÉTAIL CHARGES
             =============================================== -->

        <section class="card panel">

          <div class="panel-title">

            <h2>
              DÉTAIL CHARGES
            </h2>

            <div class="panel-actions">

              <button
                class="icon"
                type="button"
                title="Ajouter"
              >
                +
              </button>

            </div>

          </div>


          <div
            class="table-wrap"
            id="chargePanel"
          >

            <table id="chargeTable">

              <thead>

                <tr>

                  <th>N°</th>
                  <th>DÉSIGNATION</th>
                  <th>UCB</th>
                  <th>QCB</th>
                  <th>PCS</th>
                  <th>MCB</th>

                </tr>

              </thead>

              <tbody></tbody>

            </table>

          </div>

        </section>


        <!-- ===============================================
             ANALYSES
             =============================================== -->

        <section class="analysis card">

          <div class="tabs">


            <button
              class="tab active"
              data-tab="designation"
              type="button"
            >
              MARGE PAR DÉSIGNATION
            </button>


            <button
              class="tab"
              data-tab="primaryMargin"
              type="button"
            >
              MARGE PAR TACHE PRIMAIRE
            </button>


            <button
              class="tab"
              data-tab="yield"
              type="button"
            >
              RENDEMENT SELON BUDGET
            </button>


            <button
              class="icon expand-analysis"
              type="button"
              title="Plein écran"
            >
              ⛶
            </button>


          </div>


          <div id="analysisCompact"></div>

        </section>


      </section>


      <!-- ===================================================
           DÉCOMPOSITION PROJET
           =================================================== -->

      <section
        id="decomposition"
        class="view placeholder"
      >

        <h2>
          DÉCOMPOSITION PROJET
        </h2>

        <p>
          MODULE EN COURS DE CONSTRUCTION
        </p>

      </section>


      <!-- ===================================================
           ARTICLES ACHATS
           =================================================== -->

      <section
        id="achats"
        class="view placeholder"
      >

        <h2>
          ARTICLES ACHATS
        </h2>

        <p>
          MODULE EN COURS DE CONSTRUCTION
        </p>

      </section>


    </main>

  </div>


  <!-- =====================================================
       MENU COLONNES
       ===================================================== -->

  <div
    id="columnMenu"
    class="popup hidden"
  ></div>


  <!-- =====================================================
       MENU LIGNES
       ===================================================== -->

  <div
    id="rowMenu"
    class="popup hidden"
  ></div>


  <!-- =====================================================
       FENÊTRE MODALE
       ===================================================== -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-card">

      <button
        class="modal-close"
        type="button"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="app.js?v=14"></script>


</body>

</html>
